<svg width="1200" height="245" viewBox="0 0 1200 245" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="245"><stop stop-color="#071421"/><stop offset="1" stop-color="#0D1117"/></linearGradient>
    <linearGradient id="line" x1="120" y1="0" x2="1080" y2="0"><stop stop-color="#0057FF"/><stop offset=".5" stop-color="#00A6FF"/><stop offset="1" stop-color="#58A6FF"/></linearGradient>
    <filter id="g"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="245" rx="24" fill="url(#bg)" stroke="#1D4D7A"/>
  <text x="40" y="42" fill="#58A6FF" font-size="15" font-family="monospace" letter-spacing="2">COMPUTER VISION PIPELINE // END-TO-END</text>
  <line x1="122" y1="130" x2="1078" y2="130" stroke="url(#line)" stroke-width="3" opacity=".7"/>
  <circle cx="122" cy="130" r="5" fill="#EAF6FF" filter="url(#g)"><animate attributeName="cx" values="122;1078" dur="4.5s" repeatCount="indefinite"/></circle>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(122 130)"><circle r="44" fill="#0A1C2D" stroke="#1677FF" stroke-width="2"/><text y="-5" fill="#FFF" font-size="16" font-weight="700">DATA</text><text y="17" fill="#7EA8CE" font-size="12">image / video</text></g>
    <g transform="translate(313 130)"><circle r="44" fill="#0A1C2D" stroke="#168CFF" stroke-width="2"/><text y="-5" fill="#FFF" font-size="16" font-weight="700">PREP</text><text y="17" fill="#7EA8CE" font-size="12">clean · augment</text></g>
    <g transform="translate(504 130)"><circle r="44" fill="#0A1C2D" stroke="#00A6FF" stroke-width="2"/><text y="-5" fill="#FFF" font-size="16" font-weight="700">TRAIN</text><text y="17" fill="#7EA8CE" font-size="12">learn features</text></g>
    <g transform="translate(695 130)"><circle r="44" fill="#0A1C2D" stroke="#00B8FF" stroke-width="2"/><text y="-5" fill="#FFF" font-size="16" font-weight="700">INFER</text><text y="17" fill="#7EA8CE" font-size="12">detect · classify</text></g>
    <g transform="translate(886 130)"><circle r="44" fill="#0A1C2D" stroke="#39C6FF" stroke-width="2"/><text y="-5" fill="#FFF" font-size="16" font-weight="700">EVAL</text><text y="17" fill="#7EA8CE" font-size="12">metrics · tune</text></g>
    <g transform="translate(1078 130)"><circle r="44" fill="#0A1C2D" stroke="#58A6FF" stroke-width="2"/><text y="-5" fill="#FFF" font-size="16" font-weight="700">SHIP</text><text y="17" fill="#7EA8CE" font-size="12">demo · deploy</text></g>
  </g>
  <text x="600" y="218" text-anchor="middle" fill="#5B7C99" font-size="13" font-family="monospace">observe → understand → model → measure → improve</text>
