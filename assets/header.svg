<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" role="img" aria-label="AMIR — Artificial Intelligence and Computer Vision">
<defs>
  <linearGradient id="veil" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#000"/><stop offset=".48" stop-color="#0b0b0b"/><stop offset=".52" stop-color="#0b0b0b"/><stop offset="1" stop-color="#000"/>
  </linearGradient>
  <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="11s" repeatCount="indefinite"/>
  </linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
  <style><![CDATA[
    .serif{font-family:Georgia,'Times New Roman',serif}.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}.sans{font-family:Inter,'Segoe UI',sans-serif}
    .dust{animation:twinkle 4s ease-in-out infinite}@keyframes twinkle{0%,100%{opacity:.12}50%{opacity:.55}}
    .scan{animation:scan 8s ease-in-out infinite}@keyframes scan{0%,100%{transform:translateX(-180px);opacity:0}40%,60%{opacity:.55}50%{transform:translateX(1380px)}}
    .breath{animation:breath 6s ease-in-out infinite}@keyframes breath{0%,100%{opacity:.45}50%{opacity:1}}
  ]]></style>
</defs>
<rect width="1400" height="430" fill="#000"/>
<rect x="14" y="14" width="1372" height="402" rx="18" fill="url(#veil)" stroke="#202020"/>
