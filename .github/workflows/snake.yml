name: Monochrome Contribution Snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Generate black & white contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/contribution-snake.svg?color_snake=#ffffff&color_dots=#0a0a0a,#222222,#555555,#a0a0a0,#f2f2f2

      - name: Commit refreshed snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-snake.svg
          if git diff --cached --quiet; then
            echo "No snake changes."
            exit 0
          fi
          git commit -m "chore(profile): refresh monochrome contribution snake"
          git pull --rebase origin main
          git push
