name: Monochrome Contribution Snake

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"
      - "README.md"
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Generate black & white contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ github.token }}
          outputs: |
            assets/contribution-snake.svg?color_snake=#ffffff&color_dots=#080808,#242424,#555555,#9a9a9a,#f2f2f2
      - name: Commit refreshed snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-snake.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(profile): refresh monochrome snake"
          git pull --rebase origin main
          git push
