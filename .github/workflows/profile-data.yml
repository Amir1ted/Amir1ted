name: Monochrome Profile Data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-data.yml"
      - "scripts/generate_profile_data.py"
      - "README.md"
  schedule:
    - cron: "11 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Generate local monochrome stats and contribution graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: python scripts/generate_profile_data.py
      - name: Commit generated profile data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/contribution-graph.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(profile): refresh monochrome live data"
          git pull --rebase origin main
          git push
