name: Refresh Dark Profile

on:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "scripts/**"
      - ".github/workflows/refresh-profile.yml"

permissions:
  contents: write

concurrency:
  group: refresh-profile-${{ github.repository }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate live contribution graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python scripts/generate_profile_data.py

      - name: Generate monochrome contribution snake
        uses: Platane/snk/svg-only@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: >-
            assets/contribution-snake.svg?color_snake=%23d7dde4&color_dots=%23080b0f,%23252b33,%234a535e,%2389939f,%23e1e6ec

      - name: Generate 3D contribution views
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Apply dark monochrome 3D theme
        run: |
          python scripts/monochrome_3d.py \
            profile-3d-contrib/profile-season-animate.svg \
            profile-3d-contrib/profile-night-view.svg

      - name: Validate generated SVGs
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          paths = [
              Path("assets/contribution-graph.svg"),
              Path("assets/contribution-snake.svg"),
              Path("profile-3d-contrib/profile-season-animate.svg"),
              Path("profile-3d-contrib/profile-night-view.svg"),
          ]

          for path in paths:
              if not path.exists() or path.stat().st_size == 0:
                  raise SystemExit(f"missing or empty: {path}")
              ET.parse(path)
              print("valid:", path)
          PY

      - name: Commit refreshed profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            assets/contribution-graph.svg \
            assets/contribution-snake.svg \
            profile-3d-contrib/profile-season-animate.svg \
            profile-3d-contrib/profile-night-view.svg

          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi

          git commit -m "chore: refresh dark profile"
          git pull --rebase origin main
          git push origin HEAD:main
