name: Monochrome 3D Contributions

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/3d-contrib.yml"
      - "scripts/monochrome_3d.py"
      - "README.md"
  schedule:
    - cron: "37 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Generate 3D contribution SVGs
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Convert generated 3D styles to grayscale
        run: python scripts/monochrome_3d.py
      - name: Commit refreshed 3D profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(profile): refresh monochrome 3D contributions"
          git pull --rebase origin main
          git push
