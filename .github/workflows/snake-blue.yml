name: Blue Contribution Snake

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Generate blue snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-snake-blue.svg?palette=github-dark&color_snake=#00A6FF&color_dots=#0D1117,#062A4F,#0B4F8A,#0A84FF,#58A6FF

      - name: Commit updated snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-snake-blue.svg
          if git diff --cached --quiet; then
            echo "No snake changes"
            exit 0
          fi
          git commit -m "chore(profile): refresh blue contribution snake"
          git pull --rebase origin main
          git push
